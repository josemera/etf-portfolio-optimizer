name: Update ETF Data

on:
  schedule:
    - cron: '0 10 5 * *'  # 5th of every month at 10am UTC
  workflow_dispatch:        # manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: npm ci

      - run: node scripts/update-data.js --refresh-all

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/monthly_returns.json
          git diff --staged --quiet || git commit -m "chore: update ETF data $(date +'%Y-%m')"
          git push
